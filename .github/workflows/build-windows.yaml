name: Build Flutter Windows App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cache Flutter SDK (biar tidak download ulang)
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: flutter
          key: flutter-${{ runner.os }}

      # 3. Install Flutter (manual, stabil)
      - name: Install Flutter
        run: |
          if (!(Test-Path -Path "flutter")) {
            git clone https://github.com/flutter/flutter.git -b stable
          }
          echo "$PWD/flutter/bin" >> $env:GITHUB_PATH

      # 4. Cek Flutter
      - name: Flutter Doctor
        run: flutter doctor

      # 5. Enable Windows Desktop
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # 6. Ambil dependencies
      - name: Install dependencies
        run: flutter pub get

      # 7. Extract version from pubspec.yaml
      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' }
          $ver = ($line -replace 'version:\s*','').Trim()
          $semver = $ver.Split('+')[0].Trim()
          echo "semver=$semver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver (semver=$semver)"

      # 8. Build Windows app
      - name: Build Windows
        run: flutter build windows

      # 9. Upload hasil build (.exe)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-v${{ steps.version.outputs.semver }}
          path: build/windows/x64/runner/Release/